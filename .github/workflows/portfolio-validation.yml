name: Portfolio validation (not a production hunt)
on:
  workflow_dispatch:
  push:
    branches: [research/portfolio-30-40]
    paths:
      - portfolio.py
      - launch_portfolio.sh
      - tests/test_portfolio.py
      - tests/portfolio_native_smoke.py
      - .github/workflows/portfolio-validation.yml
permissions:
  contents: read
concurrency:
  group: portfolio-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libgmp-dev cargo python3-gmpy2
          python3 -m pip install --break-system-packages gmpy2
      - name: Test portfolio lifecycle helpers
        run: |
          python3 -m py_compile portfolio.py tests/test_portfolio.py tests/portfolio_native_smoke.py
          bash -n launch_portfolio.sh
          python3 -m unittest discover -s tests -p test_portfolio.py -v
      - name: Build existing Praetor engine
        run: |
          git clone --depth 1 https://github.com/ceeboozwah/Praetor.git /tmp/Praetor
          (cd /tmp/Praetor && cargo build --release -p ourc)
          OURC=/tmp/Praetor/target/release/ourc OUR_RUNTIME=/tmp/Praetor/compiler/runtime ./build.sh
          mkdir -p build/portfolio-ci
          git rev-parse HEAD > build/portfolio-ci/hunter-commit.txt
          git -C /tmp/Praetor rev-parse HEAD > build/portfolio-ci/praetor-commit.txt
      - name: Native probability and target-worker smoke tests
        timeout-minutes: 4
        run: python3 -u tests/portfolio_native_smoke.py
      - name: Equal-wall-clock primorial pilot (observed BPSW gaps)
        timeout-minutes: 8
        run: |
          python3 -u - <<'PY'
          import json, math, os, random, subprocess, time
          from pathlib import Path
          import gmpy2
          import moon
          out = Path('build/portfolio-ci')
          out.mkdir(parents=True, exist_ok=True)
          regimes = [337, 353, 1439, 6007]
          budget = 65.0
          results = []
          for P in regimes:
              start_time = time.monotonic()
              deadline = start_time + budget
              d = 2310
              rng = random.Random(20261117 + P)
              row = dict(P=P, d=d, budget_s=budget, merit_target=30,
                         probes=0, tested=0, completed=0, verified=0,
                         target_hits=0, best_merit=0., status='ok',
                         selection='highest target-rate candidate then random control')
              try:
                  env = dict(os.environ, HUNTER_PATTERNS='1')
                  call = subprocess.run(['./hunter', 'probe', str(P), str(d), '32', '30',
                                         str(100000001+P*100), '1000000'],
                         env=env, capture_output=True, text=True,
                         timeout=max(1., min(45., deadline-time.monotonic())))
                  if call.returncode:
                      raise RuntimeError('probe failed: '+call.stdout[-400:]+call.stderr[-400:])
                  candidates = moon.parse(call.stdout)
                  row['probes'] = len(candidates)
                  if not candidates:
                      raise RuntimeError('no probe candidates')
                  base = gmpy2.primorial(P)//d
                  ranked = sorted(candidates, key=lambda z:z['rate'],reverse=True)
                  control = rng.choice(ranked[1:]) if len(ranked)>1 else ranked[0]
                  chosen = [('ranked',ranked[0]),('control',control)]
                  for label,candidate in chosen:
                      if time.monotonic() >= deadline: break
                      center=base*candidate['m']
                      endpoints={}
                      for side,sgn in (('left',-1),('right',1)):
                          for offset in candidate[side]:
                              if time.monotonic()>=deadline:break
                              if gmpy2.is_bpsw_prp(center+sgn*offset):
                                  endpoints[side]=offset
                                  break
                      row['tested']+=1
                      if len(endpoints)!=2:continue
                      row['completed']+=1
                      left=center-endpoints['left']
                      right=center+endpoints['right']
                      gap=endpoints['left']+endpoints['right']
                      with gmpy2.context(precision=160):
                          merit=float(gmpy2.mpfr(gap)/gmpy2.log(left))
                      if time.monotonic()<deadline and gmpy2.next_prime(left)==right:
                          row['verified']+=1
                          row['best_merit']=max(row['best_merit'],merit)
                          row['target_hits']+=int(merit>=30)
                          row[label+'_gap']=gap
                          row[label+'_merit']=round(merit,4)
              except Exception as exc:
                  row['status']='error: '+str(exc)[:500]
              row['elapsed_s']=round(time.monotonic()-start_time,2)
              results.append(row)
              (out/'primorial-pilot.json').write_text(json.dumps(results,indent=2)+'\\n')
              print(json.dumps(row),flush=True)
          PY
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-validation-${{ github.run_id }}
          path: |
            build/portfolio-ci/
            build/ourc.log
          retention-days: 14
          if-no-files-found: warn
