name: proof-frontier-lean

on:
  pull_request:
    paths:
      - 'research/proof-frontier-calculus-v02/lean/**'
      - '.github/workflows/pfc-lean.yml'
      - 'research/pfc-external-smoke/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/proof-frontier-calculus-v02/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/lake" --version
      - name: Resolve pinned Mathlib dependencies
        run: "$HOME/.elan/bin/lake update"
      - name: Download Mathlib compiled cache
        run: "$HOME/.elan/bin/lake exe cache get"
      - name: Kernel-check proof bridge
        run: "$HOME/.elan/bin/lake build"
      - name: External fixed-template Lean smoke test
        run: python3 ../../pfc-external-smoke/run_benchmark.py
      - name: Upload reproducible smoke-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfc-external-smoke
          path: research/pfc-external-smoke/results.json
          if-no-files-found: warn
