        run: python3 -u fleet_campaign.py --seconds ${{ inputs.duration == '300' && '1800' || '600' }}
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.duration == '300' || 7 <= 3)
        with:
          name: fleet-${{ github.run_id }}-${{ matrix.shard }}-7
          path: fleet-output/
          retention-days: 2
          if-no-files-found: warn
      - name: Volume checkpoint 8 of 10
        if: inputs.duration == '300' || 8 <= 3
        env:
          HUNTER_SHARD: ${{ matrix.shard }}
          HUNTER_TOTAL_SECONDS: ${{ inputs.duration == '300' && '18000' || '1800' }}
        run: python3 -u fleet_campaign.py --seconds ${{ inputs.duration == '300' && '1800' || '600' }}
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.duration == '300' || 8 <= 3)
        with:
          name: fleet-${{ github.run_id }}-${{ matrix.shard }}-8
          path: fleet-output/
          retention-days: 2
          if-no-files-found: warn
      - name: Volume checkpoint 9 of 10
        if: inputs.duration == '300' || 9 <= 3
        env:
