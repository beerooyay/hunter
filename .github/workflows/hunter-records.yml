# relaunch after run 42979731546
name: Hunter record-first campaign
on:
  workflow_dispatch:
  push:
    branches:
      - cloud/nine-volume-20261105
    paths:
      - .github/workflows/hunter-records.yml
jobs:
  hunt-records:
    name: volume ${{ matrix.arm }} · shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arm: '6007.210', shard: 0}
          - {arm: '6007.210', shard: 1}
          - {arm: '6007.2310', shard: 2}
          - {arm: '6007.2310', shard: 3}
          - {arm: '6007.2310', shard: 4}
          - {arm: '8009.210', shard: 5}
          - {arm: '8009.210', shard: 6}
          - {arm: '8009.2310', shard: 7}
          - {arm: '8009.2310', shard: 8}
          - {arm: '6007.210', shard: 9}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libgmp-dev cargo
      - name: Build Praetor
        run: |
          git clone --depth 1 https://github.com/ceeboozwah/Praetor.git /tmp/Praetor
          cd /tmp/Praetor
          cargo build --release -p ourc
      - name: Build Hunter
        env:
          OURC: /tmp/Praetor/target/release/ourc
          OUR_RUNTIME: /tmp/Praetor/compiler/runtime
        run: ./build.sh
      - name: Run five-hour native volume search
        env:
          HUNTER_ARM: ${{ matrix.arm }}
          HUNTER_SHARD: ${{ matrix.shard }}
        run: python3 -u native_campaign.py
      - name: Preserve results and learner files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunter-native-${{ matrix.arm }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            FOUND.tsv
            VERIFIED.tsv
            gaps.tsv
            jobs.tsv
            state.tsv
            hunt.log
            native-status.json
            native-server.log
          retention-days: 7
          if-no-files-found: warn
