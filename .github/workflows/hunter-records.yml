          HUNTER_TOTAL_SECONDS: ${{ inputs.duration == '300' && '18000' || '1800' }}
        run: python3 -u fleet_campaign.py --seconds ${{ inputs.duration == '300' && '1800' || '600' }}
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.duration == '300' || 9 <= 3)
        with:
          name: fleet-${{ github.run_id }}-${{ matrix.shard }}-9
          path: fleet-output/
          retention-days: 2
          if-no-files-found: warn
      - name: Volume checkpoint 10 of 10
        if: inputs.duration == '300' || 10 <= 3
        env:
          HUNTER_SHARD: ${{ matrix.shard }}
          HUNTER_TOTAL_SECONDS: ${{ inputs.duration == '300' && '18000' || '1800' }}
        run: python3 -u fleet_campaign.py --seconds ${{ inputs.duration == '300' && '1800' || '600' }}
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.duration == '300' || 10 <= 3)
        with:
          name: fleet-${{ github.run_id }}-${{ matrix.shard }}-10
          path: fleet-output/
          retention-days: 2
          if-no-files-found: warn
  brain:
    needs: [build, volume]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fleet-native
      - uses: actions/download-artifact@v4
        with:
          pattern: fleet-${{ github.run_id }}-*
          path: fleet-input
      - run: chmod +x hunter
      - name: Evaluate frozen model before fitting
        run: python3 -m optimizer.evaluate
      - name: Train shared shadow model on deduplicated observations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from optimizer.brain import train
          train(list(Path('fleet-input').rglob('gaps.tsv')),Path('brain-output'),replay=Path('optimizer/replay.jsonl.gz'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-brain-${{ github.run_id }}
          path: brain-output/
          retention-days: 7
